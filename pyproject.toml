[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-auth-audit"
version = "1.0.0"
description = "Deterministic, no-LLM mixed-auth security-schema auditor for MCP servers. Audits declared auth vs observed schemes, catches no-auth-exposed-in-mixed, scheme-mismatch targeting holes, missing scopes on mutating OAuth2, anonymous mutation, credential-leak paths. Crown-jewel-clean, auditable line by line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sudo-ai-git", email = "sudo-ai-git@users.noreply.github.com" }]
keywords = ["mcp", "security", "auth", "audit", "mixed-auth", "llm-agents", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]
dependencies = ["mcp>=1.0,<2"]

[project.scripts]
mcp-auth-audit = "server:main_entry"

[tool.setuptools]
py-modules = ["mcp_auth_audit", "server"]
